<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Chosen concept: 02-tile-grid-ai — light tile grid + center plus -->
  <rect width="96" height="96" rx="22" fill="#F3F0F8"/>

  <!-- Tiles -->
  <rect x="12" y="12" width="32" height="32" rx="10" fill="#F5A524"/>
  <rect x="52" y="12" width="32" height="32" rx="10" fill="#EC4899"/>
  <rect x="12" y="52" width="32" height="32" rx="10" fill="#38BDF8"/>
  <rect x="52" y="52" width="32" height="32" rx="10" fill="#34D399"/>

  <!-- Cart (cream on orange) -->
  <g fill="#FFE8C2">
    <circle cx="22" cy="36" r="2.2"/>
    <circle cx="32" cy="36" r="2.2"/>
    <path d="M18 18h4.2l1.2 3.2h12.6l-1.6 8.2H21.4z"/>
    <rect x="22.5" y="24.5" width="10.5" height="5.5" rx="1.2"/>
  </g>

  <!-- Heart (light pink on magenta) — Material favorite path, centered in tile -->
  <g fill="#F9C2E0" transform="translate(68 27.5) scale(0.78) translate(-12 -12)">
    <path
      d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
    />
  </g>

  <!-- Briefcase (pale blue on sky) -->
  <g fill="#D7F0FF">
    <rect x="20" y="64" width="16" height="11" rx="2.5"/>
    <rect x="24.5" y="60.5" width="7" height="4" rx="1.2"/>
    <rect x="26.5" y="67.5" width="3" height="3.5" rx="0.8"/>
  </g>

  <!-- Person (pale green on mint) -->
  <g fill="#CFF8E6">
    <circle cx="68" cy="63" r="4.2"/>
    <path d="M60.5 76.5c0-4.2 3.4-7 7.5-7s7.5 2.8 7.5 7v1.2H60.5z"/>
  </g>

  <!-- Center plus badge -->
  <circle cx="48" cy="48" r="15" fill="#F7F5FB"/>
  <rect x="41" y="46" width="14" height="4" rx="2" fill="#A78BFA"/>
  <rect x="46" y="41" width="4" height="14" rx="2" fill="#A78BFA"/>
</svg>
